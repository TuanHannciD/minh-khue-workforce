name: mkw

services:
  db:
    # The entrypoint validates every value as name@sha256:<64 hex> before this
    # file reaches Compose. Compose never receives a tag or performs lookup.
    image: ${MKW_POSTGRES_IMAGE:?MKW_POSTGRES_IMAGE immutable digest is required}
    restart: unless-stopped
    env_file: ./shared/db.env
    volumes:
      - mkw_pgdata:/var/lib/postgresql/data
    networks: [mkw-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    image: ${MKW_API_IMAGE:?MKW_API_IMAGE immutable digest is required}
    pull_policy: never
    restart: unless-stopped
    env_file: ./shared/api.env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }
    networks: [mkw-internal]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    image: ${MKW_WEB_IMAGE:?MKW_WEB_IMAGE immutable digest is required}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MKW_GATEWAY_PORT:-3200}:8080"
    depends_on:
      api: { condition: service_healthy }
    networks: [mkw-internal, mkw-gateway]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mkw_pgdata:
    name: mkw_pgdata

networks:
  mkw-gateway: {}
  mkw-internal:
    name: mkw-internal
    internal: true
