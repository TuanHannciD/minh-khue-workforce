name: MKW production deploy

run-name: "mkw-deploy-${{ inputs.coordinator_id || github.run_id }}"

on:
  workflow_call:
    inputs:
      control_sha:
        description: Immutable control SHA for an automatic release; manual recovery uses current main
        required: false
        type: string
      coordinator_id:
        description: Release correlation
        required: false
        type: string
      operation_id:
        description: Stable operation identifier for receipts and idempotency
        required: false
        type: string
      mode:
        description: Deployment mode
        required: true
        type: string
      release_run_attempt:
        description: Exact release run attempt
        required: true
        type: string
      release_artifact_digest:
        description: Exact release archive digest
        required: true
        type: string
      backup_run_attempt:
        description: Exact backup run attempt
        required: true
        type: string
      backup_artifact_digest:
        description: Exact backup archive digest
        required: true
        type: string
      release_sha:
        description: Full immutable release SHA
        required: true
        type: string
      release_run_id:
        description: Exact build workflow run ID
        required: true
        type: string
      release_artifact_id:
        description: Exact release artifact ID
        required: true
        type: string
      release_artifact_name:
        description: Exact release artifact name
        required: true
        type: string
      api_digest:
        description: Exact API image digest from build
        required: true
        type: string
      web_digest:
        description: Exact web image digest from build
        required: true
        type: string
      postgres_image:
        description: Exact pinned PostgreSQL image from build
        required: true
        type: string
      backup_run_id:
        description: Exact backup workflow run ID
        required: true
        type: string
      backup_artifact_id:
        description: Exact backup artifact ID
        required: true
        type: string
      backup_artifact_name:
        description: Exact backup artifact name
        required: true
        type: string
      backup_kind:
        description: Backup contract kind
        required: true
        type: string
      backup_max_age_seconds:
        description: Maximum backup age in seconds
        required: false
        type: string
        default: "86400"
      provenance:
        description: Resolved release and backup producer tuples from coordinator
        required: false
        type: string
      simple_release:
        description: Automatic push-main path without state adoption or rollback orchestration
        required: false
        type: boolean
        default: false
    secrets:
      MKW_SSH_PRIVATE_KEY:
        required: true
    outputs:
      correlation_id:
        description: Release correlation carried by this deploy stage
        value: ${{ jobs.deploy.outputs.correlation_id }}
      deploy_run_id:
        description: Deploy workflow run ID
        value: ${{ jobs.deploy.outputs.deploy_run_id }}
      release_status:
        description: Deploy job result
        value: ${{ jobs.deploy.outputs.release_status }}
  workflow_dispatch:
    inputs:
      coordinator_id:
        description: Unique coordinator dispatch correlation
        required: false
        type: string
      mode:
        description: Deployment mode
        required: true
        type: choice
        options: [dry-run, bootstrap, release]
        default: dry-run
      release_sha:
        description: Full commit SHA whose immutable release artifact is deployed
        required: true
        type: string
      release_run_id:
        description: Build-release workflow run that owns the artifact
        required: false
        type: string
      release_artifact_id:
        description: Exact release artifact id resolved by the coordinator
        required: false
        type: string
      backup_run_id:
        description: Backup workflow run containing backup-ready metadata
        required: false
        type: string
      backup_artifact_id:
        description: Exact backup artifact id resolved by the coordinator
        required: false
        type: string
      backup_kind:
        description: Required backup contract kind
        required: false
        type: choice
        options: [BACKUP, INITIAL_EMPTY_DEPLOYMENT]
      backup_max_age_seconds:
        description: Maximum backup age in seconds at mutation time
        required: false
        type: string
        default: "86400"
      provenance:
        description: Optional JSON release and backup producer tuples; resolved from canonical artifacts when omitted
        required: false
        type: string

concurrency:
  group: ${{ (github.event_name == 'push' || startsWith(inputs.coordinator_id, 'parent-')) && format('mkw-deploy-child-{0}', github.run_id) || 'mkw-production-release' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  deploy:
    outputs:
      correlation_id: ${{ inputs.coordinator_id || github.run_id }}
      deploy_run_id: ${{ github.run_id }}
      release_status: ${{ steps.source.outputs.release_status || steps.remote.outputs.release_status || job.status }}
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production-recovery' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require approved source ref
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == workflow_dispatch ]]; then
            [[ "${GITHUB_REF:-}" == refs/heads/main ]] || { echo 'manual recovery must be dispatched from canonical main' >&2; exit 78; }
          fi
      - name: Checkout trusted current policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.control_sha || 'main' }}
          path: policy
          persist-credentials: false

      - name: Checkout release source as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1

      - name: Validate mode-specific artifact inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
          BACKUP_ARTIFACT_ID: ${{ inputs.backup_artifact_id }}
          BACKUP_ARTIFACT_NAME: ${{ inputs.backup_artifact_name }}
          BACKUP_KIND: ${{ inputs.backup_kind }}
          SIMPLE_RELEASE: ${{ inputs.simple_release }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt || fromJSON(inputs.provenance || '{}').release.runAttempt || '' }}
          RELEASE_ARTIFACT_DIGEST: ${{ inputs.release_artifact_digest || fromJSON(inputs.provenance || '{}').release.artifactDigest || '' }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          BACKUP_RUN_ATTEMPT: ${{ inputs.backup_run_attempt || fromJSON(inputs.provenance || '{}').backup.runAttempt || '' }}
          BACKUP_ARTIFACT_DIGEST: ${{ inputs.backup_artifact_digest || fromJSON(inputs.provenance || '{}').backup.artifactDigest || '' }}
        run: |
          set -Eeuo pipefail
          case "$MODE" in
            dry-run|bootstrap) exit 0 ;;
            release) ;;
            *) echo 'invalid deploy mode' >&2; exit 64 ;;
          esac

          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'release_artifact_id is required for release' >&2; exit 64; }
          [[ -z "${RELEASE_ARTIFACT_NAME:-}" || "$RELEASE_ARTIFACT_NAME" == "mkw-release-$RELEASE_SHA" ]] || { echo 'release_artifact_name must be the SHA-named release artifact' >&2; exit 64; }
          [[ "$BACKUP_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'backup_artifact_id is required for release' >&2; exit 64; }
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'release_run_id is required for release' >&2; exit 64; }
          if [[ -n "${RELEASE_RUN_ATTEMPT:-}" ]]; then [[ "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo 'release_run_attempt is invalid' >&2; exit 64; }; fi
          if [[ -n "${RELEASE_ARTIFACT_DIGEST:-}" ]]; then [[ "$RELEASE_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]] || { echo 'release_artifact_digest is invalid' >&2; exit 64; }; fi
          [[ "$BACKUP_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'backup_run_id is required for release' >&2; exit 64; }
          if [[ -n "${BACKUP_RUN_ATTEMPT:-}" ]]; then [[ "$BACKUP_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo 'backup_run_attempt is invalid' >&2; exit 64; }; fi
          if [[ -n "${BACKUP_ARTIFACT_DIGEST:-}" ]]; then [[ "$BACKUP_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]] || { echo 'backup_artifact_digest is invalid' >&2; exit 64; }; fi
          [[ -z "$BACKUP_ARTIFACT_NAME" || "$BACKUP_ARTIFACT_NAME" =~ ^mkw-backup-[1-9][0-9]*-[1-9][0-9]*$ ]] || { echo 'backup_artifact_name is required for release' >&2; exit 64; }
          [[ "$BACKUP_KIND" == BACKUP || "$BACKUP_KIND" == INITIAL_EMPTY_DEPLOYMENT ]] || { echo 'backup_kind is required for release' >&2; exit 64; }
          if [[ "${SIMPLE_RELEASE:-false}" == true && "$BACKUP_KIND" != BACKUP ]]; then echo 'simple push-main releases require an existing-database BACKUP' >&2; exit 64; fi

      - name: Validate active coordinator parent
        if: startsWith(inputs.coordinator_id, 'parent-')
        env:
          COORDINATOR_ID: ${{ inputs.coordinator_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node policy/scripts/product/release/check-coordinator-parent.mjs

      - name: Download immutable release artifact
        if: inputs.mode == 'release'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: ${{ inputs.release_artifact_id }}
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Download backup-ready metadata
        if: inputs.mode == 'release'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: ${{ inputs.backup_artifact_id }}
          path: backup-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}

      - name: Validate artifact and release manifest
        id: provenance
        if: inputs.mode == 'release'
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt || fromJSON(inputs.provenance || '{}').release.runAttempt || '' }}
          RELEASE_ARTIFACT_DIGEST: ${{ inputs.release_artifact_digest || fromJSON(inputs.provenance || '{}').release.artifactDigest || '' }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id || '' }}
          BACKUP_ARTIFACT_ID: ${{ inputs.backup_artifact_id || '' }}
          BACKUP_RUN_ATTEMPT: ${{ inputs.backup_run_attempt || fromJSON(inputs.provenance || '{}').backup.runAttempt || '' }}
          BACKUP_ARTIFACT_DIGEST: ${{ inputs.backup_artifact_digest || fromJSON(inputs.provenance || '{}').backup.artifactDigest || '' }}
          MKW_AUTOMATIC_RELEASE: ${{ inputs.control_sha != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_JSON: ${{ inputs.provenance }}
          BACKUP_KIND: ${{ inputs.backup_kind }}
          BACKUP_MAX_AGE_SECONDS: ${{ inputs.backup_max_age_seconds || '86400' }}
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          TARGET_DATABASE: mkw
          TARGET_IDENTITY: ${{ vars.MKW_SSH_HOST }}/${{ vars.MKW_DEPLOY_PATH }}/${{ vars.MKW_PROJECT_NAME }}
          EXPECTED_API_DIGEST: ${{ inputs.api_digest }}
          EXPECTED_WEB_DIGEST: ${{ inputs.web_digest }}
          EXPECTED_POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full 40-char lowercase SHA'; exit 64; }
          : "${MKW_SSH_HOST:?Trusted production host is required}"
          : "${TARGET_IDENTITY:?Trusted production target identity is required}"
          test -s policy/scripts/product/deploy-entrypoint.sh
          test -f release-artifact/release-manifest.json
          test -f release-artifact/release-manifest.sha256
          (cd release-artifact && sha256sum --check release-manifest.sha256)
          node policy/scripts/product/release/validate-manifest.mjs release-artifact/release-manifest.json
          test -s backup-ready/backup-ready.json
          BACKUP_NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node policy/scripts/product/release/validate-backup-ready.mjs backup-ready/backup-ready.json \
            --expected-release-sha "$RELEASE_SHA" --expected-kind "$BACKUP_KIND" \
            --expected-target-host "$MKW_SSH_HOST" --expected-database "$TARGET_DATABASE" --expected-target-identity "$TARGET_IDENTITY" \
            --max-age-seconds "$BACKUP_MAX_AGE_SECONDS" --now "$BACKUP_NOW"
          node --input-type=module - "$RELEASE_SHA" release-artifact/release-manifest.json <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [expected, path] = process.argv.slice(2);
          const manifest = JSON.parse(await readFile(path, 'utf8'));
          if (manifest.releaseSha !== expected) throw new Error('manifest releaseSha does not match release_sha');
          if (process.env.GITHUB_REPOSITORY && manifest.sourceRepository !== process.env.GITHUB_REPOSITORY) throw new Error('manifest sourceRepository does not match repository');
          const expectedApi = process.env.EXPECTED_API_DIGEST;
          const expectedWeb = process.env.EXPECTED_WEB_DIGEST;
          const expectedPostgres = process.env.EXPECTED_POSTGRES_IMAGE;
          if (expectedApi && !manifest.apiImage.endsWith(`@${expectedApi}`)) throw new Error('manifest API digest does not match build output');
          if (expectedWeb && !manifest.webImage.endsWith(`@${expectedWeb}`)) throw new Error('manifest web digest does not match build output');
          if (expectedPostgres && manifest.postgresImage !== expectedPostgres) throw new Error('manifest PostgreSQL image does not match build output');
          NODE

          node policy/scripts/product/release/resolve-dispatch-provenance.mjs

      - name: Verify release attestations when configured
        id: attestations
        if: inputs.mode == 'release'
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ATTESTATION_MODE: ${{ vars.MKW_ATTESTATION_MODE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          mode="${ATTESTATION_MODE:-not-configured}"
          case "$mode" in
            not-configured|off|best-effort|required) ;;
            *) echo 'MKW_ATTESTATION_MODE must be one of not-configured, off, best-effort, required' >&2; exit 78 ;;
          esac
          status="not-configured"
          if [[ "$mode" == off ]]; then
            status="not-configured"
          elif [[ "$mode" == best-effort || "$mode" == required ]]; then
            status="not-verified"
            if command -v gh >/dev/null 2>&1; then
              # The build attests the manifest, which binds both application image
              # digests and the pinned PostgreSQL image. Verify that exact file.
              # Suppress CLI output: failure is represented by the receipt state,
              # never by an untrusted command transcript.
              if gh attestation verify release-artifact/release-manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-release.yml" >/dev/null 2>&1; then
                status="verified"
              fi
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "attestation_status=$status" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$mode" == required && "$status" != verified ]]; then
            echo 'required attestation verification did not complete for the release manifest' >&2
            exit 78
          fi

      - name: Recheck current main before remote mutation
        id: source
        if: inputs.control_sha != ''
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid release SHA' >&2; exit 64; }
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]] || exit 78
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "ORCHESTRATION_OUTCOME=superseded release_sha=$RELEASE_SHA current_sha=$current_sha" >&2
            echo 'release_status=superseded' >> "$GITHUB_OUTPUT"
          fi

      - name: Run remote deploy entrypoint with verified artifact
        id: remote
        if: steps.source.outputs.release_status != 'superseded'
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          MKW_SSH_PORT: ${{ vars.MKW_SSH_PORT }}
          MKW_SSH_HOST_FINGERPRINT: ${{ vars.MKW_SSH_HOST_FINGERPRINT }}
          MKW_DEPLOY_PATH: ${{ vars.MKW_DEPLOY_PATH }}
          MKW_PROJECT_NAME: ${{ vars.MKW_PROJECT_NAME }}
          MKW_GATEWAY_PORT: ${{ vars.MKW_GATEWAY_PORT }}
          MKW_ATTESTATION_MODE: ${{ vars.MKW_ATTESTATION_MODE }}
          MKW_ATTESTATION_STATUS: ${{ steps.attestations.outputs.status || 'not-applicable' }}
          MKW_BACKUP_MAX_AGE_SECONDS: ${{ inputs.backup_max_age_seconds || '86400' }}
          MKW_BACKUP_EXPECTED_KIND: ${{ inputs.backup_kind || 'BACKUP' }}
          MKW_BACKUP_EXPECTED_HOST: ${{ vars.MKW_SSH_HOST }}
          MKW_BACKUP_EXPECTED_DATABASE: mkw
          MKW_BACKUP_EXPECTED_TARGET_IDENTITY: ${{ vars.MKW_SSH_HOST }}/${{ vars.MKW_DEPLOY_PATH }}/${{ vars.MKW_PROJECT_NAME }}
          MKW_REGISTRY_HOST: ${{ vars.MKW_REGISTRY_HOST || 'ghcr.io' }}
          MKW_REGISTRY_VISIBILITY: ${{ vars.MKW_REGISTRY_VISIBILITY || '' }}
          MKW_REGISTRY_PULL_USERNAME: ${{ vars.MKW_REGISTRY_PULL_USERNAME || '' }}
          MKW_REGISTRY_PULL_TOKEN_FILE: ${{ vars.MKW_REGISTRY_PULL_TOKEN_FILE || '' }}
          MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
          MKW_OPERATION_ID: ${{ inputs.operation_id || inputs.coordinator_id || github.run_id }}
          MKW_AUTOMATIC_RELEASE: false
          MKW_SIMPLE_RELEASE: ${{ inputs.simple_release }}
          MKW_RELEASE_RUN_ID: ${{ steps.provenance.outputs.release_run_id || inputs.release_run_id }}
          MKW_RELEASE_RUN_ATTEMPT: ${{ steps.provenance.outputs.release_run_attempt || inputs.release_run_attempt }}
          MKW_RELEASE_ARTIFACT_ID: ${{ steps.provenance.outputs.release_artifact_id || inputs.release_artifact_id }}
          MKW_RELEASE_ARTIFACT_DIGEST: ${{ steps.provenance.outputs.release_artifact_digest || inputs.release_artifact_digest }}
          MKW_BACKUP_PROVENANCE: ${{ steps.provenance.outputs.backup_provenance }}
          MKW_CONTROL_SHA: ${{ inputs.control_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          : "${MKW_SSH_HOST:?Set production variable MKW_SSH_HOST}"
          : "${MKW_SSH_PORT:?Set production variable MKW_SSH_PORT}"
          : "${MKW_SSH_HOST_FINGERPRINT:?Set production variable MKW_SSH_HOST_FINGERPRINT}"
          : "${MKW_DEPLOY_PATH:?Set production variable MKW_DEPLOY_PATH}"
          : "${MKW_PROJECT_NAME:?Set production variable MKW_PROJECT_NAME}"
          : "${MKW_GATEWAY_PORT:?Set production variable MKW_GATEWAY_PORT}"
          [[ "$MKW_DEPLOY_PATH" =~ ^/home/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*$ ]] || { echo 'invalid deploy path' >&2; exit 78; }
          [[ "$MKW_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'invalid project name' >&2; exit 78; }
          [[ "$MKW_GATEWAY_PORT" =~ ^[0-9]+$ ]] && ((MKW_GATEWAY_PORT >= 1024 && MKW_GATEWAY_PORT <= 65535)) || { echo 'invalid gateway port' >&2; exit 78; }
          case "$MODE" in dry-run|bootstrap|release) ;; *) echo 'invalid deploy mode' >&2; exit 64 ;; esac
          if [[ "$MODE" == release ]]; then
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid release SHA' >&2; exit 64; }
            [[ "$MKW_BACKUP_MAX_AGE_SECONDS" =~ ^[0-9]+$ ]] || { echo 'invalid backup freshness policy' >&2; exit 78; }
          fi
          MKW_REGISTRY_PULL_TOKEN_FILE="${MKW_REGISTRY_PULL_TOKEN_FILE:-$MKW_DEPLOY_PATH/shared/secrets/ghcr-pull-token}"
          install -m 700 -d "$HOME/.ssh"
          : "${MKW_SSH_HOST_FINGERPRINT:?Trusted SSH fingerprint is required}"
          ssh-keyscan -T 10 -p "$MKW_SSH_PORT" "$MKW_SSH_HOST" > "$RUNNER_TEMP/mkw_known_hosts"
          : > "$RUNNER_TEMP/mkw_pinned_hosts"
          while IFS= read -r line; do
            printf '%s\n' "$line" > "$RUNNER_TEMP/mkw_candidate"
            if [[ "$(ssh-keygen -lf "$RUNNER_TEMP/mkw_candidate" -E sha256 | awk '{print $2}')" == "$MKW_SSH_HOST_FINGERPRINT" ]]; then
              printf '%s\n' "$line" >> "$RUNNER_TEMP/mkw_pinned_hosts"
            fi
          done < "$RUNNER_TEMP/mkw_known_hosts"
          test -s "$RUNNER_TEMP/mkw_pinned_hosts"
          install -m 600 "$RUNNER_TEMP/mkw_pinned_hosts" "$HOME/.ssh/known_hosts"
          test -n "$MKW_SSH_PRIVATE_KEY"
          printf '%s\n' "$MKW_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/mkw_key"
          chmod 600 "$RUNNER_TEMP/mkw_key"
          if [[ "$MODE" != release ]]; then
            ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" \
              "deploy@$MKW_SSH_HOST" \
              "MKW_DEPLOY_PATH=$(printf '%q' "$MKW_DEPLOY_PATH") MKW_PROJECT_NAME=$(printf '%q' "$MKW_PROJECT_NAME") MKW_GATEWAY_PORT=$(printf '%q' "$MKW_GATEWAY_PORT") bash -s -- --$(printf '%q' "$MODE")" \
              < policy/scripts/product/deploy-entrypoint.sh
            exit 0
          fi
          remote_dir="${MKW_DEPLOY_PATH}/releases/${RELEASE_SHA}"
          (cd backup-ready && sha256sum backup-ready.json > backup-ready.json.sha256)
          (cd backup-ready && sha256sum --check backup-ready.json.sha256)
          tar -czf "$RUNNER_TEMP/mkw-release.tgz" release-artifact backup-ready/backup-ready.json backup-ready/backup-ready.json.sha256 -C policy scripts/product/deploy-entrypoint.sh scripts/product/release -C "$GITHUB_WORKSPACE/release-source" deploy/compose.production.yml
          printf -v remote_command 'mkdir -p -- %q' "$remote_dir"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" "$remote_command"

          scp -q -i "$RUNNER_TEMP/mkw_key" -P "$MKW_SSH_PORT" -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "$RUNNER_TEMP/mkw-release.tgz" "deploy@$MKW_SSH_HOST:$remote_dir/release.tgz"
          printf -v remote_command 'tar -xzf %q -C %q && (cd %q && sha256sum --check backup-ready.json.sha256) && install -m 640 %q %q && rm -rf -- %q %q' \
            "$remote_dir/release.tgz" "$remote_dir" "$remote_dir/backup-ready" "$remote_dir/backup-ready/backup-ready.json" "$MKW_DEPLOY_PATH/shared/backup-ready.json" "$remote_dir/backup-ready" "$remote_dir/release.tgz"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" "$remote_command"
          api_image="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('release-artifact/release-manifest.json','utf8')).apiImage)")"
          [[ "$api_image" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          MKW_OPERATION_ID="${MKW_OPERATION_ID:-$RELEASE_SHA}"
          MKW_AUTOMATIC_RELEASE="${MKW_AUTOMATIC_RELEASE:-false}"
          printf -v remote_env 'MKW_DEPLOY_PATH=%q MKW_PROJECT_NAME=%q MKW_GATEWAY_PORT=%q MKW_RELEASE_SHA=%q MKW_OPERATION_ID=%q MKW_API_IMAGE=%q MKW_RELEASE_RUN_ID=%q MKW_RELEASE_RUN_ATTEMPT=%q MKW_RELEASE_ARTIFACT_ID=%q MKW_RELEASE_ARTIFACT_DIGEST=%q MKW_CONTROL_SHA=%q MKW_REGISTRY_HOST=%q MKW_REGISTRY_VISIBILITY=%q MKW_REGISTRY_PULL_USERNAME=%q MKW_REGISTRY_PULL_TOKEN_FILE=%q MKW_ATTESTATION_MODE=%q MKW_ATTESTATION_STATUS=%q MKW_BACKUP_MAX_AGE_SECONDS=%q MKW_BACKUP_EXPECTED_KIND=%q MKW_BACKUP_EXPECTED_HOST=%q MKW_BACKUP_EXPECTED_DATABASE=%q MKW_BACKUP_EXPECTED_TARGET_IDENTITY=%q' \
            "$MKW_DEPLOY_PATH" "$MKW_PROJECT_NAME" "$MKW_GATEWAY_PORT" "$RELEASE_SHA" "$MKW_OPERATION_ID" "$api_image" "${MKW_RELEASE_RUN_ID:-}" "${MKW_RELEASE_RUN_ATTEMPT:-}" "${MKW_RELEASE_ARTIFACT_ID:-}" "${MKW_RELEASE_ARTIFACT_DIGEST:-}" "${MKW_CONTROL_SHA:-$RELEASE_SHA}" "${MKW_REGISTRY_HOST:-ghcr.io}" "${MKW_REGISTRY_VISIBILITY:-}" "${MKW_REGISTRY_PULL_USERNAME:-}" "${MKW_REGISTRY_PULL_TOKEN_FILE:-}" "${MKW_ATTESTATION_MODE:-not-configured}" "${MKW_ATTESTATION_STATUS:-not-verified}" "${MKW_BACKUP_MAX_AGE_SECONDS:-86400}" "${MKW_BACKUP_EXPECTED_KIND:-BACKUP}" "${MKW_BACKUP_EXPECTED_HOST:-}" "${MKW_BACKUP_EXPECTED_DATABASE:-mkw}" "${MKW_BACKUP_EXPECTED_TARGET_IDENTITY:-}"
          # deploy-entrypoint.sh enforces the forward migration gate (pnpm db:deploy / migrate deploy) before compose up and traffic smoke checks.
          printf -v remote_command '%s bash %q --release --manifest %q --compose %q --backup-ready %q' "$remote_env" "$remote_dir/scripts/product/deploy-entrypoint.sh" "$remote_dir/release-artifact/release-manifest.json" "$remote_dir/deploy/compose.production.yml" "$MKW_DEPLOY_PATH/shared/backup-ready.json"
          remote_command="MKW_AUTOMATIC_RELEASE=$(printf '%q' "$MKW_AUTOMATIC_RELEASE") MKW_SIMPLE_RELEASE=$(printf '%q' "${MKW_SIMPLE_RELEASE:-false}") $remote_command"
          remote_command="MKW_BACKUP_PROVENANCE=$(printf '%q' "${MKW_BACKUP_PROVENANCE:-}") $remote_command"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" "$remote_command" | tee "$RUNNER_TEMP/mkw-deploy-output"
          if [[ "$MKW_AUTOMATIC_RELEASE" == true ]] && grep -Fqx "ORCHESTRATION_OUTCOME=already-deployed release_sha=$RELEASE_SHA operation_id=$MKW_OPERATION_ID" "$RUNNER_TEMP/mkw-deploy-output"; then
            echo 'release_status=already-deployed' >> "$GITHUB_OUTPUT"
          fi
