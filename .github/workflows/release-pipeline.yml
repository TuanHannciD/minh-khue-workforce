name: MKW release coordinator

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      mode:
        description: Deployment mode
        required: true
        type: choice
        options: [dry-run, bootstrap, release]
        default: dry-run
      backup_kind:
        description: Backup contract required for this release
        required: false
        type: choice
        options: [BACKUP, INITIAL_EMPTY_DEPLOYMENT]
        default: BACKUP

permissions:
  contents: read
  actions: write

concurrency:
  group: mkw-release-coordinator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout trusted current orchestration policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Run exact release pipeline
        shell: bash
        env:
          GH_TOKEN_VALUE: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          BACKUP_KIND: ${{ inputs.backup_kind || 'BACKUP' }}
          CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/product/release/run-coordinator.mjs
