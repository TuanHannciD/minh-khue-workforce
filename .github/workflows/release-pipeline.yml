name: MKW release coordinator

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      mode:
        description: Deployment mode
        required: true
        type: choice
        options: [dry-run, bootstrap, release]
        default: dry-run
      backup_kind:
        description: Backup contract required for this release
        required: false
        type: choice
        options: [BACKUP, INITIAL_EMPTY_DEPLOYMENT]
        default: BACKUP

permissions:
  contents: read
  actions: write

concurrency:
  group: mkw-production-release
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    environment: production-recovery
    timeout-minutes: 180
    steps:
      - name: Require approved source ref
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'manual recovery must be dispatched from canonical main' >&2; exit 78; }
          fi
      - name: Checkout trusted current orchestration policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Run exact release pipeline
        shell: bash
        env:
          GH_TOKEN_VALUE: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          BACKUP_KIND: ${{ inputs.backup_kind || 'BACKUP' }}
          CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          MKW_DEPLOY_PATH: ${{ vars.MKW_DEPLOY_PATH }}
          MKW_PROJECT_NAME: ${{ vars.MKW_PROJECT_NAME }}
        run: node scripts/product/release/run-coordinator.mjs
