name: MKW post-deploy verification

run-name: "mkw-post-deploy-verify-${{ inputs.coordinator_id || github.run_id }}"

on:
  workflow_call:
    inputs:
      control_sha:
        description: Immutable control SHA for an automatic release; manual recovery uses current main
        required: false
        type: string
      coordinator_id:
        description: Release correlation
        required: false
        type: string
      operation_id:
        description: Stable release operation identifier for receipts
        required: false
        type: string
      mode:
        description: Verification mode
        required: true
        type: string
      release_sha:
        description: Release SHA to verify
        required: true
        type: string
      release_run_id:
        description: Exact build workflow run ID
        required: true
        type: string
      release_run_attempt:
        description: Exact producing attempt
        required: true
        type: string
      release_artifact_digest:
        description: Exact archive digest
        required: true
        type: string
      release_artifact_id:
        description: Exact release artifact ID
        required: true
        type: string
      api_digest:
        description: Exact API digest from build
        required: true
        type: string
      web_digest:
        description: Exact web digest from build
        required: true
        type: string
      postgres_image:
        description: Exact PostgreSQL image from build
        required: true
        type: string
    secrets:
      MKW_SSH_PRIVATE_KEY:
        required: true
    outputs:
      correlation_id:
        description: Release correlation carried by verification
        value: ${{ jobs.verify.outputs.correlation_id }}
      verify_run_id:
        description: Verification workflow run ID
        value: ${{ jobs.verify.outputs.verify_run_id }}
      release_status:
        description: Verification result
        value: ${{ jobs.verify.outputs.release_status }}
  workflow_dispatch:
    inputs:
      coordinator_id:
        description: Unique coordinator dispatch correlation
        required: false
        type: string
      mode:
        description: Verify release runtime or preflight only for dry-run/bootstrap
        required: true
        type: choice
        options: [dry-run, bootstrap, release]
        default: release
      release_sha:
        description: Release SHA to verify
        required: true
        type: string
      release_run_id:
        description: Build-release workflow run containing the release manifest
        required: false
        type: string
      release_run_attempt:
        description: Optional exact producing attempt; derived when omitted
        required: false
        type: string
      release_artifact_digest:
        description: Optional exact archive digest; derived when omitted
        required: false
        type: string
      release_artifact_id:
        description: Exact release artifact id resolved by the coordinator
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    outputs:
      correlation_id: ${{ inputs.coordinator_id || github.run_id }}
      verify_run_id: ${{ github.run_id }}
      release_status: ${{ job.status }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production-recovery' || 'production' }}
    timeout-minutes: 15
    steps:
      - name: Require approved source ref
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'manual recovery must be dispatched from canonical main' >&2; exit 78; }
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-source

      - name: Checkout trusted current policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.control_sha || 'main' }}
          fetch-depth: 1
          persist-credentials: false
          path: policy
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1

      - name: Validate mode-specific artifact inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          case "$MODE" in
            dry-run|bootstrap) [[ -z "$RELEASE_ARTIFACT_ID" || "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ;;
            release) [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'release_run_id and release_artifact_id are required for release' >&2; exit 64; } ;;
            *) echo 'invalid verification mode' >&2; exit 64 ;;
          esac

      - name: Validate active coordinator parent
        if: startsWith(inputs.coordinator_id, 'parent-')
        env:
          COORDINATOR_ID: ${{ inputs.coordinator_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node policy/scripts/product/release/check-coordinator-parent.mjs

      - name: Download and validate release manifest
        if: inputs.mode == 'release' || inputs.release_artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: ${{ inputs.release_artifact_id }}
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Validate exact release linkage for every mode
        id: provenance
        if: inputs.mode == 'release' || inputs.release_artifact_id != ''
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ inputs.release_artifact_digest }}
          MKW_AUTOMATIC_RELEASE: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_API_DIGEST: ${{ inputs.api_digest }}
          EXPECTED_WEB_DIGEST: ${{ inputs.web_digest }}
          EXPECTED_POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: |
          set -Eeuo pipefail
          (cd release-artifact && sha256sum --check release-manifest.sha256)
          node policy/scripts/product/release/validate-manifest.mjs release-artifact/release-manifest.json
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { parseJsonStrict } from './policy/scripts/product/release/validate-manifest.mjs';
          const m = parseJsonStrict(await readFile('release-artifact/release-manifest.json', 'utf8'));
          if (m.releaseSha !== process.env.RELEASE_SHA) throw new Error('manifest releaseSha mismatch');
          if (process.env.GITHUB_REPOSITORY && m.sourceRepository !== process.env.GITHUB_REPOSITORY) throw new Error('manifest sourceRepository mismatch');
          if (process.env.EXPECTED_API_DIGEST && !m.apiImage.endsWith(`@${process.env.EXPECTED_API_DIGEST}`)) throw new Error('manifest API digest mismatch');
          if (process.env.EXPECTED_WEB_DIGEST && !m.webImage.endsWith(`@${process.env.EXPECTED_WEB_DIGEST}`)) throw new Error('manifest web digest mismatch');
          if (process.env.EXPECTED_POSTGRES_IMAGE && m.postgresImage !== process.env.EXPECTED_POSTGRES_IMAGE) throw new Error('manifest PostgreSQL image mismatch');
          NODE
          node policy/scripts/product/release/resolve-dispatch-provenance.mjs

      - name: Verify running image digests, migration status, health, and smoke
        if: inputs.mode == 'release'
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          MKW_SSH_PORT: ${{ vars.MKW_SSH_PORT }}
          MKW_SSH_HOST_FINGERPRINT: ${{ vars.MKW_SSH_HOST_FINGERPRINT }}
          MKW_DEPLOY_PATH: ${{ vars.MKW_DEPLOY_PATH }}
          MKW_PROJECT_NAME: ${{ vars.MKW_PROJECT_NAME }}
          MKW_GATEWAY_PORT: ${{ vars.MKW_GATEWAY_PORT }}
          MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
          MKW_RELEASE_RUN_ID: ${{ steps.provenance.outputs.release_run_id || inputs.release_run_id }}
          MKW_RELEASE_RUN_ATTEMPT: ${{ steps.provenance.outputs.release_run_attempt || inputs.release_run_attempt }}
          MKW_RELEASE_ARTIFACT_ID: ${{ steps.provenance.outputs.release_artifact_id || inputs.release_artifact_id }}
          MKW_RELEASE_ARTIFACT_DIGEST: ${{ steps.provenance.outputs.release_artifact_digest || inputs.release_artifact_digest }}
          MKW_OPERATION_ID: ${{ inputs.operation_id || inputs.coordinator_id || github.run_id }}
          MKW_AUTOMATIC_RELEASE: false
          MKW_SIMPLE_RELEASE: ${{ inputs.control_sha != '' }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          test -f release-artifact/release-manifest.json
          test -f release-artifact/release-manifest.sha256
          (cd release-artifact && sha256sum --check release-manifest.sha256)
          node policy/scripts/product/release/validate-manifest.mjs release-artifact/release-manifest.json
          mapfile -t manifest_images < <(node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const m = JSON.parse(await readFile('release-artifact/release-manifest.json', 'utf8'));
          if (m.releaseSha !== process.env.RELEASE_SHA) throw new Error('manifest releaseSha mismatch');
          for (const k of ['apiImage', 'webImage', 'postgresImage']) console.log(m[k]);
          NODE
          )
          [[ "${#manifest_images[@]}" -eq 3 ]]
          EXPECTED_API_IMAGE="${manifest_images[0]}"; EXPECTED_WEB_IMAGE="${manifest_images[1]}"; EXPECTED_POSTGRES_IMAGE="${manifest_images[2]}"
          install -m 700 -d "$HOME/.ssh"
          : "${MKW_SSH_HOST_FINGERPRINT:?Trusted SSH fingerprint is required}"
          ssh-keyscan -T 10 -p "$MKW_SSH_PORT" "$MKW_SSH_HOST" > "$RUNNER_TEMP/mkw_known_hosts"
          : > "$RUNNER_TEMP/mkw_pinned_hosts"
          while IFS= read -r line; do
            printf '%s\n' "$line" > "$RUNNER_TEMP/mkw_candidate"
            if [[ "$(ssh-keygen -lf "$RUNNER_TEMP/mkw_candidate" -E sha256 | awk '{print $2}')" == "$MKW_SSH_HOST_FINGERPRINT" ]]; then
              printf '%s\n' "$line" >> "$RUNNER_TEMP/mkw_pinned_hosts"
            fi
          done < "$RUNNER_TEMP/mkw_known_hosts"
          test -s "$RUNNER_TEMP/mkw_pinned_hosts"
          install -m 600 "$RUNNER_TEMP/mkw_pinned_hosts" "$HOME/.ssh/known_hosts"
          test -n "$MKW_SSH_PRIVATE_KEY"
          printf '%s\n' "$MKW_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/mkw_key"; chmod 600 "$RUNNER_TEMP/mkw_key"
          MKW_OPERATION_ID="${MKW_OPERATION_ID:-$RELEASE_SHA}"
          remote_env="EXPECTED_API_IMAGE=$(printf '%q' "$EXPECTED_API_IMAGE") EXPECTED_WEB_IMAGE=$(printf '%q' "$EXPECTED_WEB_IMAGE") EXPECTED_POSTGRES_IMAGE=$(printf '%q' "$EXPECTED_POSTGRES_IMAGE") MKW_PROJECT_NAME=$(printf '%q' "$MKW_PROJECT_NAME") MKW_DEPLOY_PATH=$(printf '%q' "$MKW_DEPLOY_PATH") MKW_GATEWAY_PORT=$(printf '%q' "$MKW_GATEWAY_PORT") RELEASE_SHA=$(printf '%q' "$RELEASE_SHA") MKW_OPERATION_ID=$(printf '%q' "$MKW_OPERATION_ID")"
          remote_env="MKW_AUTOMATIC_RELEASE=$(printf '%q' "${MKW_AUTOMATIC_RELEASE:-false}") $remote_env"
          remote_env="MKW_SIMPLE_RELEASE=$(printf '%q' "${MKW_SIMPLE_RELEASE:-false}") $remote_env"
          remote_env="MKW_RELEASE_RUN_ID=$(printf '%q' "${MKW_RELEASE_RUN_ID:-}") MKW_RELEASE_RUN_ATTEMPT=$(printf '%q' "${MKW_RELEASE_RUN_ATTEMPT:-}") MKW_RELEASE_ARTIFACT_ID=$(printf '%q' "${MKW_RELEASE_ARTIFACT_ID:-}") MKW_RELEASE_ARTIFACT_DIGEST=$(printf '%q' "${MKW_RELEASE_ARTIFACT_DIGEST:-}") $remote_env"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" "$remote_env bash -s" < policy/scripts/product/post-deploy-verify.sh

      - name: Record verification receipt
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const receipt = {
            mode: process.env.MODE,
            runtimeVerification: process.env.MODE === 'release' ? 'attempted' : 'skipped-preflight-only',
            releaseSha: process.env.RELEASE_SHA,
            imageDigests: 'exact-manifest-image-ids-and-digests',
            startup: 'compose-running-and-health-checked',
            migration: 'prisma-migrate-status',
            recovery: 'manual-operator-route-only',
            result: process.env.JOB_STATUS,
          };
          const signal = {
            signal: 'none',
            releaseSha: process.env.RELEASE_SHA,
            reason: process.env.JOB_STATUS === 'success' ? 'verification passed' : 'verification failed; stop and use the manual recovery runbook',
            runId: process.env.RUN_ID,
          };
          await writeFile('verification-receipt.json', `${JSON.stringify(receipt)}\n`, { mode: 0o600 });
          await writeFile('manual-recovery-notice.json', `${JSON.stringify(signal)}\n`, { mode: 0o600 });
          NODE
          test -s verification-receipt.json

      - name: Upload verification receipt and manual-recovery notice
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mkw-post-deploy-receipt-${{ inputs.release_sha }}
          path: |
            verification-receipt.json
            manual-recovery-notice.json
          if-no-files-found: error
