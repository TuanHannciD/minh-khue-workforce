name: MKW post-deploy verification

run-name: "mkw-post-deploy-verify-${{ inputs.coordinator_id || github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      coordinator_id:
        description: Unique coordinator dispatch correlation
        required: false
        type: string
      mode:
        description: Verify release runtime or preflight only for dry-run/bootstrap
        required: true
        type: choice
        options: [dry-run, bootstrap, release]
        default: release
      release_sha:
        description: Release SHA to verify
        required: true
        type: string
      release_run_id:
        description: Build-release workflow run containing the release manifest
        required: false
        type: string
      release_artifact_id:
        description: Exact release artifact id resolved by the coordinator
        required: false
        type: string
      rollback_on_failure:
        description: Emit an actionable rollback signal when verification fails
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-source

      - name: Checkout trusted current policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: policy

      - name: Validate mode-specific artifact inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -Eeuo pipefail
          case "$MODE" in
            dry-run|bootstrap) [[ -z "$RELEASE_ARTIFACT_ID" || "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ;;
            release) [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'release_run_id and release_artifact_id are required for release' >&2; exit 64; } ;;
            *) echo 'invalid verification mode' >&2; exit 64 ;;
          esac

      - name: Download and validate release manifest
        if: inputs.mode == 'release' || inputs.release_artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: ${{ inputs.release_artifact_id }}
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Validate exact release linkage for every mode
        if: inputs.mode == 'release' || inputs.release_artifact_id != ''
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          (cd release-artifact && sha256sum --check release-manifest.sha256)
          node policy/scripts/product/release/validate-manifest.mjs release-artifact/release-manifest.json
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { parseJsonStrict } from './policy/scripts/product/release/validate-manifest.mjs';
          const m = parseJsonStrict(await readFile('release-artifact/release-manifest.json', 'utf8'));
          if (m.releaseSha !== process.env.RELEASE_SHA) throw new Error('manifest releaseSha mismatch');
          NODE

      - name: Verify running digests, schema, gateway, and startup health
        if: inputs.mode == 'release'
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          MKW_SSH_PORT: ${{ vars.MKW_SSH_PORT }}
          MKW_SSH_HOST_FINGERPRINT: ${{ vars.MKW_SSH_HOST_FINGERPRINT }}
          MKW_DEPLOY_PATH: ${{ vars.MKW_DEPLOY_PATH }}
          MKW_PROJECT_NAME: ${{ vars.MKW_PROJECT_NAME }}
          MKW_GATEWAY_PORT: ${{ vars.MKW_GATEWAY_PORT }}
          MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          test -f release-artifact/release-manifest.json
          test -f release-artifact/release-manifest.sha256
          (cd release-artifact && sha256sum --check release-manifest.sha256)
          node policy/scripts/product/release/validate-manifest.mjs release-artifact/release-manifest.json
          mapfile -t manifest_images < <(node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const m = JSON.parse(await readFile('release-artifact/release-manifest.json', 'utf8'));
          if (m.releaseSha !== process.env.RELEASE_SHA) throw new Error('manifest releaseSha mismatch');
          for (const k of ['apiImage', 'webImage', 'postgresImage']) console.log(m[k]);
          NODE
          )
          [[ "${#manifest_images[@]}" -eq 3 ]]
          EXPECTED_API_IMAGE="${manifest_images[0]}"; EXPECTED_WEB_IMAGE="${manifest_images[1]}"; EXPECTED_POSTGRES_IMAGE="${manifest_images[2]}"
          install -m 700 -d "$HOME/.ssh"
          : "${MKW_SSH_HOST_FINGERPRINT:?Trusted SSH fingerprint is required}"
          ssh-keyscan -T 10 -p "$MKW_SSH_PORT" "$MKW_SSH_HOST" > "$RUNNER_TEMP/mkw_known_hosts"
          : > "$RUNNER_TEMP/mkw_pinned_hosts"
          while IFS= read -r line; do
            printf '%s\n' "$line" > "$RUNNER_TEMP/mkw_candidate"
            if [[ "$(ssh-keygen -lf "$RUNNER_TEMP/mkw_candidate" -E sha256 | awk '{print $2}')" == "$MKW_SSH_HOST_FINGERPRINT" ]]; then
              printf '%s\n' "$line" >> "$RUNNER_TEMP/mkw_pinned_hosts"
            fi
          done < "$RUNNER_TEMP/mkw_known_hosts"
          test -s "$RUNNER_TEMP/mkw_pinned_hosts"
          install -m 600 "$RUNNER_TEMP/mkw_pinned_hosts" "$HOME/.ssh/known_hosts"
          test -n "$MKW_SSH_PRIVATE_KEY"
          printf '%s\n' "$MKW_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/mkw_key"; chmod 600 "$RUNNER_TEMP/mkw_key"
          remote_env="EXPECTED_API_IMAGE=$(printf '%q' "$EXPECTED_API_IMAGE") EXPECTED_WEB_IMAGE=$(printf '%q' "$EXPECTED_WEB_IMAGE") EXPECTED_POSTGRES_IMAGE=$(printf '%q' "$EXPECTED_POSTGRES_IMAGE") MKW_PROJECT_NAME=$(printf '%q' "$MKW_PROJECT_NAME") MKW_DEPLOY_PATH=$(printf '%q' "$MKW_DEPLOY_PATH") MKW_GATEWAY_PORT=$(printf '%q' "$MKW_GATEWAY_PORT") RELEASE_SHA=$(printf '%q' "$RELEASE_SHA")"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" "$remote_env bash -s" < policy/scripts/product/post-deploy-verify.sh

      - name: Record verification receipt
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_ON_FAILURE: ${{ inputs.rollback_on_failure }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const receipt = {
            mode: process.env.MODE,
            runtimeVerification: process.env.MODE === 'release' ? 'attempted' : 'skipped-preflight-only',
            releaseSha: process.env.RELEASE_SHA,
            gateway: 'smoke',
            schema: 'prisma-migrate-status',
            imageDigests: 'exact-manifest-image-ids-and-digests',
            startup: 'compose-running-and-health-checked',
            rollback: '.github/workflows/rollback.yml',
            rollbackOnFailure: process.env.ROLLBACK_ON_FAILURE === 'true',
            result: process.env.JOB_STATUS,
          };
          const signal = {
            signal: 'none',
            releaseSha: process.env.RELEASE_SHA,
            workflow: '.github/workflows/rollback.yml',
            reason: process.env.JOB_STATUS === 'success' ? 'verification passed' : 'verification did not pass; inspect receipt',
            runId: process.env.RUN_ID,
          };
          await writeFile('verification-receipt.json', `${JSON.stringify(receipt)}\n`, { mode: 0o600 });
          await writeFile('rollback-signal.json', `${JSON.stringify(signal)}\n`, { mode: 0o600 });
          NODE
          test -s verification-receipt.json

      - name: Emit actionable rollback signal
        if: failure() && inputs.rollback_on_failure
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from 'node:fs/promises';
          const signal = {
            signal: 'rollback-requested',
            releaseSha: process.env.RELEASE_SHA,
            workflow: '.github/workflows/rollback.yml',
            reason: 'post-deploy verification failed; inspect verification-receipt.json and startup logs',
            runId: process.env.RUN_ID,
          };
          await writeFile('rollback-signal.json', `${JSON.stringify(signal)}\n`, { mode: 0o600 });
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `rollback-requested: run .github/workflows/rollback.yml for ${JSON.stringify(process.env.RELEASE_SHA)}\n`);
          NODE

      - name: Upload verification receipt and rollback signal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mkw-post-deploy-receipt-${{ inputs.release_sha }}
          path: |
            verification-receipt.json
            rollback-signal.json
          if-no-files-found: error
