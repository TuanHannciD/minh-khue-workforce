name: Build immutable release

on:
  workflow_call:
    outputs:
      release_run_attempt:
        description: Exact producer release_run_attempt
        value: ${{ jobs.release.outputs.release_run_attempt }}
      release_artifact_digest:
        description: Exact producer release_artifact_digest
        value: ${{ jobs.release.outputs.release_artifact_digest }}
      release_sha:
        description: Full source SHA used for this immutable release
        value: ${{ jobs.release.outputs.release_sha }}
      release_run_id:
        description: Build workflow run owning the release artifact
        value: ${{ jobs.release.outputs.release_run_id }}
      release_artifact_name:
        description: Exact immutable release artifact name
        value: ${{ jobs.release.outputs.release_artifact_name }}
      release_artifact_id:
        description: Exact immutable release artifact ID
        value: ${{ jobs.release.outputs.release_artifact_id }}
      api_digest:
        description: Exact API image digest
        value: ${{ jobs.release.outputs.api_digest }}
      web_digest:
        description: Exact web image digest
        value: ${{ jobs.release.outputs.web_digest }}
      postgres_image:
        description: Exact pinned PostgreSQL image
        value: ${{ jobs.release.outputs.postgres_image }}

concurrency:
  group: mkw-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_run_attempt: ${{ github.run_attempt }}
      release_artifact_digest: ${{ steps.upload-release.outputs.artifact-digest }}
      release_sha: ${{ github.sha }}
      release_run_id: ${{ github.run_id }}
      release_artifact_name: mkw-release-${{ github.sha }}
      release_artifact_id: ${{ steps.upload-release.outputs.artifact-id }}
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      postgres_image: ${{ steps.postgres.outputs.image }}
    steps:
      - name: Validate attestation mode
        shell: bash
        env:
          ATTESTATION_MODE: ${{ vars.MKW_ATTESTATION_MODE }}
        run: |
          set -Eeuo pipefail
          case "${ATTESTATION_MODE:-not-configured}" in
            not-configured|off|best-effort|required) ;;
            *) echo 'MKW_ATTESTATION_MODE must be one of not-configured, off, best-effort, required' >&2; exit 78 ;;
          esac

      - name: Checkout immutable CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'push source SHA must be a full 40-character lowercase SHA' >&2
            exit 64
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/mkw-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/mkw-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true

      - name: Read pinned PostgreSQL image
        id: postgres
        shell: bash
        run: |
          set -Eeuo pipefail
          postgres_image="$(awk -F= '$1 == "MKW_POSTGRES_IMAGE" { value=$2; count++ } END { if (count == 1) print value }' deploy/postgres-image.env)"
          [[ "$postgres_image" =~ ^postgres@sha256:[0-9a-f]{64}$ ]] || {
            echo 'deploy/postgres-image.env must contain exactly one immutable PostgreSQL image' >&2
            exit 78
          }
          echo "image=$postgres_image" >> "$GITHUB_OUTPUT"

      - name: Export registry attestations for immutable digests
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          OWNER: ${{ steps.image.outputs.owner }}
        run: |
          set -Eeuo pipefail
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_with_retry() {
            local image="$1" output="$2" label="$3" attempt=1 temporary="${2}.tmp" error_file="${2}.error"
            while (( attempt <= 8 )); do
              rm -f "$temporary" "$error_file"
              if docker buildx imagetools inspect "$image" --raw >"$temporary" 2>"$error_file" &&
                test -s "$temporary" && jq -e type "$temporary" >/dev/null 2>&1; then
                mv "$temporary" "$output"
                return 0
              fi
              echo "registry attestation read for ${label} was not ready (attempt ${attempt}/8); retrying" >&2
              sleep $(( attempt * 2 ))
              attempt=$((attempt + 1))
            done
            echo "unable to read registry manifest for ${label} after 8 attempts" >&2
            sed -E 's/(token|password|secret|authorization)[^[:space:]]*/[REDACTED]/Ig' "$error_file" >&2 || true
            return 1
          }
          attestations_present() {
            jq -e '
              [.. | objects |
                (.annotations["vnd.docker.reference.type"]? // "") as $reference |
                (.artifactType? // "") as $artifact |
                (.mediaType? // "") as $media |
                select(
                  ($reference == "attestation-manifest") or
                  (($artifact + " " + $media) | test("in-toto|cyclonedx|spdx"; "i"))
                )
              ] | length > 0
            ' "$1" >/dev/null
          }
          inspect_with_retry "ghcr.io/${OWNER}/mkw-api@${API_DIGEST}" api-attestations.json api
          inspect_with_retry "ghcr.io/${OWNER}/mkw-web@${WEB_DIGEST}" web-attestations.json web
          attestations_present api-attestations.json || {
            echo 'API image manifest has no SBOM/provenance attestation descriptor' >&2
            exit 1
          }
          attestations_present web-attestations.json || {
            echo 'Web image manifest has no SBOM/provenance attestation descriptor' >&2
            exit 1
          }

      - name: Write release metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          POSTGRES_IMAGE: ${{ steps.postgres.outputs.image }}
        run: |
          set -Eeuo pipefail
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$POSTGRES_IMAGE" =~ ^postgres@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "{
            \"sourceSha\": \"$SOURCE_SHA\",
            \"apiDigest\": \"$API_DIGEST\",
            \"webDigest\": \"$WEB_DIGEST\",
            \"postgresImage\": \"$POSTGRES_IMAGE\",
            \"generatedBy\": \"docker/build-push-action\"
          }" > build-metadata.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const metadata = JSON.parse(await readFile('build-metadata.json', 'utf8'));
          metadata.producerRunId = process.env.GITHUB_RUN_ID;
          metadata.producerRunAttempt = process.env.GITHUB_RUN_ATTEMPT;
          await writeFile('build-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          const artifact = async (path) => {
            const bytes = await readFile(path);
            return { sha256: createHash('sha256').update(bytes).digest('hex'), size: bytes.length };
          };
          const manifest = {
            schemaVersion: '1',
            releaseSha: metadata.sourceSha,
            sourceRepository: process.env.GITHUB_REPOSITORY,
            createdAt: new Date().toISOString(),
            apiImage: `ghcr.io/${process.env.GITHUB_REPOSITORY_OWNER.toLowerCase()}/mkw-api@${metadata.apiDigest}`,
            webImage: `ghcr.io/${process.env.GITHUB_REPOSITORY_OWNER.toLowerCase()}/mkw-web@${metadata.webDigest}`,
            postgresImage: metadata.postgresImage,
            artifacts: { sbom: await artifact('api-attestations.json'), provenance: await artifact('web-attestations.json') },
          };
          await writeFile('release-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          node scripts/product/release/validate-manifest.mjs release-manifest.json
          sha256sum release-manifest.json > release-manifest.sha256
          sha256sum release-manifest.json api-attestations.json web-attestations.json > release-checksums.sha256

      - name: Attest release manifest provenance
        if: vars.MKW_ATTESTATION_MODE == 'best-effort' || vars.MKW_ATTESTATION_MODE == 'required'
        continue-on-error: ${{ vars.MKW_ATTESTATION_MODE == 'best-effort' }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-manifest.json
          show-summary: false

      - name: Upload immutable release artifact
        id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mkw-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release-manifest.json
            release-manifest.sha256
            release-checksums.sha256
            api-attestations.json
            web-attestations.json
            build-metadata.json
