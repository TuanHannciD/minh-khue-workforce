name: CI

on:
  workflow_call:
    outputs:
      quality_sha:
        description: Source SHA checked by this quality job
        value: ${{ jobs.checks.outputs.quality_sha }}
      quality_status:
        description: Quality job result
        value: ${{ jobs.checks.outputs.quality_status }}
  pull_request:

concurrency:
  group: mkw-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    outputs:
      quality_sha: ${{ github.sha }}
      quality_status: ${{ job.status }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Set up pnpm
        shell: bash
        run: corepack enable
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run product:lint
      - name: Format check
        run: pnpm run product:format:check
      - name: Typecheck
        run: pnpm run product:typecheck
      - name: Build
        run: pnpm run product:build
      - name: Tooling tests
        run: pnpm run product:test:tooling
      - name: Sandbox tests
        run: pnpm run product:test:sandbox
      - name: Web tests
        run: pnpm --filter @mkw/web test --run
      - name: API tests
        run: pnpm --filter @mkw/api test
      - name: Contract check
        run: pnpm run product:contract:check
      - name: Product boundaries
        run: pnpm run product:boundaries
