name: MKW protected rollback

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Unique rollback operation ID; omitted generates rollback-run-attempt-old SHA
        required: false
        type: string
      old_release_sha:
        description: Previously verified release SHA
        required: true
        type: string
      old_release_run_id:
        description: Build-release run containing the old immutable artifact
        required: true
        type: string
      old_release_artifact_id:
        description: Exact immutable release artifact ID from the canonical build-release run
        required: true
        type: string
      backup_run_id:
        description: Backup workflow run containing a fresh current-database snapshot
        required: true
        type: string
      backup_artifact_id:
        description: Exact backup artifact id for the current-database snapshot
        required: true
        type: string
      reason:
        description: Incident/approval reference confirming old application compatibility with current database schema; no database restore
        required: true
        type: string

concurrency:
  group: mkw-production-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  rollback:
    environment: production-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require approved source ref
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'manual recovery must be dispatched from canonical main' >&2; exit 78; }
          fi
      - name: Require canonical rollback dispatch
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'rollback must be dispatched from canonical main' >&2; exit 78; }

      # Old release checkout is data; only current controls are executed.
      - name: Checkout current rollback control tooling
        id: controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1

      - name: Resolve exact old release artifact through trusted policy
        id: release
        shell: bash
        env:
          OLD_RELEASE_SHA: ${{ inputs.old_release_sha }}
          OLD_RELEASE_RUN_ID: ${{ inputs.old_release_run_id }}
          OLD_RELEASE_ARTIFACT_ID: ${{ inputs.old_release_artifact_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/product/release/resolve-rollback.mjs

      - name: Checkout old release source as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.old_release_sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Download and verify old manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          path: old-release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.old_release_run_id }}
          artifact-ids: ${{ inputs.old_release_artifact_id }}

      - name: Resolve canonical rollback snapshot
        id: snapshot
        shell: bash
        env:
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          BACKUP_ARTIFACT_ID: ${{ inputs.backup_artifact_id }}
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          TARGET_DATABASE: mkw
          TARGET_IDENTITY: ${{ vars.MKW_SSH_HOST }}/${{ vars.MKW_DEPLOY_PATH }}/${{ vars.MKW_PROJECT_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          node scripts/product/release/resolve-rollback-backup.mjs resolve

      - name: Download current-database rollback snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          artifact-ids: ${{ steps.snapshot.outputs.backup_artifact_id }}
          path: backup-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.snapshot.outputs.backup_run_id }}

      - name: Verify old manifest and backup-ready gate
        id: attestations
        shell: bash
        env:
          RELEASE_RESOLVED_PATH: ${{ steps.release.outputs.release_resolved_path }}
          BACKUP_RESOLVED_PATH: ${{ steps.snapshot.outputs.backup_resolved_path }}
          OLD_RELEASE_SHA: ${{ inputs.old_release_sha }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          ATTESTATION_MODE: ${{ vars.MKW_ATTESTATION_MODE }}
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          TARGET_DATABASE: mkw
          TARGET_IDENTITY: ${{ vars.MKW_SSH_HOST }}/${{ vars.MKW_DEPLOY_PATH }}/${{ vars.MKW_PROJECT_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$OLD_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          [[ -n "$ROLLBACK_REASON" && "${#ROLLBACK_REASON}" -le 512 ]] || { echo 'rollback reason must be 1-512 characters' >&2; exit 64; }
          node --input-type=module <<'NODE'
          if (/[\u0000-\u001f\u007f]/u.test(process.env.ROLLBACK_REASON)) {
            throw new Error('rollback reason contains a control character');
          }
          NODE
          test -f old-release-artifact/release-manifest.json
          test -f old-release-artifact/release-manifest.sha256
          (cd old-release-artifact && sha256sum --check release-manifest.sha256)
          node scripts/product/release/validate-manifest.mjs old-release-artifact/release-manifest.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { isDeepStrictEqual } from 'node:util';
          import { parseJsonStrict } from './scripts/product/release/validate-manifest.mjs';
          try {
            const c=parseJsonStrict(await readFile(process.env.RELEASE_RESOLVED_PATH,'utf8'));
            for(const [entry,canonical] of [['release-manifest.json',c.manifest],['build-metadata.json',c.metadata]]) {
              if(!isDeepStrictEqual(parseJsonStrict(await readFile(`old-release-artifact/${entry}`,'utf8')),canonical)) throw new Error();
            }
          } catch { console.error('canonical old release metadata mismatch'); process.exitCode=78; }
          NODE
          node --input-type=module - "$OLD_RELEASE_SHA" old-release-artifact/release-manifest.json <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [expected, path] = process.argv.slice(2);
          const manifest = JSON.parse(await readFile(path, 'utf8'));
          if (manifest.releaseSha !== expected) throw new Error('old manifest releaseSha mismatch');
          NODE
          test -s backup-ready/backup-ready.json
          node scripts/product/release/resolve-rollback-backup.mjs verify --resolved "$BACKUP_RESOLVED_PATH" --downloaded backup-ready/backup-ready.json
          mode="${ATTESTATION_MODE:-not-configured}"
          case "$mode" in
            not-configured|off|best-effort|required) ;;
            *) echo 'MKW_ATTESTATION_MODE must be one of not-configured, off, best-effort, required' >&2; exit 78 ;;
          esac
          attestation_status="not-configured"
          if [[ "$mode" == best-effort || "$mode" == required ]]; then
            attestation_status="not-verified"
            if command -v gh >/dev/null 2>&1 && gh attestation verify old-release-artifact/release-manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-release.yml" >/dev/null 2>&1; then
              attestation_status="verified"
            fi
          fi
          echo "status=$attestation_status" >> "$GITHUB_OUTPUT"
          echo "attestation_status=$attestation_status" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$mode" == required && "$attestation_status" != verified ]]; then
            echo 'required attestation verification did not complete for the old release manifest' >&2
            exit 78
          fi
          echo 'Old manifest and rollback reason verified'

      - name: Redeploy exact old digests through deploy-entrypoint.sh
        shell: bash
        env:
          RELEASE_RESOLVED_PATH: ${{ steps.release.outputs.release_resolved_path }}
          MKW_OPERATION_ID: ${{ inputs.operation_id || format('rollback-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.old_release_sha) }}
          MKW_CONTROL_SHA: ${{ steps.controls.outputs.commit }}
          MKW_RELEASE_RUN_ID: ${{ steps.release.outputs.release_run_id }}
          MKW_RELEASE_RUN_ATTEMPT: ${{ steps.release.outputs.release_run_attempt }}
          MKW_RELEASE_ARTIFACT_ID: ${{ steps.release.outputs.release_artifact_id }}
          MKW_RELEASE_ARTIFACT_DIGEST: ${{ steps.release.outputs.release_artifact_digest }}
          BACKUP_RESOLVED_PATH: ${{ steps.snapshot.outputs.backup_resolved_path }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          OLD_RELEASE_SHA: ${{ inputs.old_release_sha }}
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          MKW_SSH_PORT: ${{ vars.MKW_SSH_PORT }}
          MKW_SSH_HOST_FINGERPRINT: ${{ vars.MKW_SSH_HOST_FINGERPRINT }}
          MKW_DEPLOY_PATH: ${{ vars.MKW_DEPLOY_PATH }}
          MKW_PROJECT_NAME: ${{ vars.MKW_PROJECT_NAME }}
          MKW_GATEWAY_PORT: ${{ vars.MKW_GATEWAY_PORT }}
          MKW_ATTESTATION_MODE: ${{ vars.MKW_ATTESTATION_MODE }}
          MKW_ATTESTATION_STATUS: ${{ steps.attestations.outputs.status || 'not-applicable' }}
          MKW_BACKUP_MAX_AGE_SECONDS: "86400"
          MKW_BACKUP_EXPECTED_KIND: BACKUP
          MKW_BACKUP_EXPECTED_HOST: ${{ vars.MKW_SSH_HOST }}
          MKW_BACKUP_EXPECTED_DATABASE: mkw
          MKW_BACKUP_EXPECTED_TARGET_IDENTITY: ${{ vars.MKW_SSH_HOST }}/${{ vars.MKW_DEPLOY_PATH }}/${{ vars.MKW_PROJECT_NAME }}
          MKW_REGISTRY_HOST: ${{ vars.MKW_REGISTRY_HOST || 'ghcr.io' }}
          MKW_REGISTRY_VISIBILITY: ${{ vars.MKW_REGISTRY_VISIBILITY || '' }}
          MKW_REGISTRY_PULL_USERNAME: ${{ vars.MKW_REGISTRY_PULL_USERNAME || '' }}
          MKW_REGISTRY_PULL_TOKEN_FILE: ${{ vars.MKW_REGISTRY_PULL_TOKEN_FILE || '' }}
          MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$MKW_DEPLOY_PATH" =~ ^/home/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*$ ]] || { echo 'invalid deploy path' >&2; exit 78; }
          [[ "$MKW_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'invalid project name' >&2; exit 78; }
          [[ "$MKW_GATEWAY_PORT" =~ ^[0-9]+$ ]] && ((MKW_GATEWAY_PORT >= 1024 && MKW_GATEWAY_PORT <= 65535)) || { echo 'invalid gateway port' >&2; exit 78; }
          [[ "$OLD_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid old release SHA' >&2; exit 64; }
          MKW_OPERATION_ID="${MKW_OPERATION_ID:-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${OLD_RELEASE_SHA}}"
          node scripts/product/release/operation-id.mjs validate "$MKW_OPERATION_ID" >/dev/null
          [[ "$MKW_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid control SHA' >&2; exit 78; }
          operation_input="$(mktemp -d "$RUNNER_TEMP/mkw-operation.XXXXXX")"
          cp -- backup-ready/backup-ready.json "$operation_input/backup-ready.json"
          (cd "$operation_input" && sha256sum backup-ready.json > backup-ready.sha256)
          MKW_SSH_HOST="$MKW_BACKUP_EXPECTED_HOST" TARGET_DATABASE="$MKW_BACKUP_EXPECTED_DATABASE" TARGET_IDENTITY="$MKW_BACKUP_EXPECTED_TARGET_IDENTITY" node scripts/product/release/resolve-rollback-backup.mjs verify --resolved "$BACKUP_RESOLVED_PATH" --downloaded "$operation_input/backup-ready.json"
          cp -- "$BACKUP_RESOLVED_PATH" "$operation_input/rollback-backup-resolved.json"
          cp -- "$RELEASE_RESOLVED_PATH" "$operation_input/rollback-release-resolved.json"
          node --input-type=module - "$operation_input/rollback-operation.json" <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const reason = process.env.ROLLBACK_REASON;
          if (!reason || reason.length > 512 || /[\u0000-\u001f\u007f]/u.test(reason)) { process.exitCode=78; } else {
            await writeFile(process.argv[2], JSON.stringify({reason, releaseSha:process.env.OLD_RELEASE_SHA, releaseRunId:process.env.MKW_RELEASE_RUN_ID, releaseRunAttempt:process.env.MKW_RELEASE_RUN_ATTEMPT, releaseArtifactId:process.env.MKW_RELEASE_ARTIFACT_ID, releaseArtifactDigest:process.env.MKW_RELEASE_ARTIFACT_DIGEST}), {mode:0o600});
          }
          NODE
          bundle="$RUNNER_TEMP/mkw-rollback-bundle"
          legacy=()
          # Explicit compatibility adapter, only after canonical archive/source gates.
          # Inventory records transport bytes; it does not attest legacy output or add CLI capability.
          if [[ ! -f old-release-artifact/bundle-inventory.json ]]; then legacy=(--legacy); fi
          node scripts/product/release/release-bundle.mjs pack --release-artifact old-release-artifact --release-source release-source --controls . --operation "$operation_input" --output "$bundle" --rollback-release "$RELEASE_RESOLVED_PATH" "${legacy[@]}"
          rm -rf -- "$operation_input"
          # Read only the packaged bytes bound to the trusted canonical record.
          api_image="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).apiImage)" "$bundle/release/release-manifest.json")"
          postgres_image="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).postgresImage)" "$bundle/release/release-manifest.json")"
          [[ "$api_image" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$postgres_image" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          MKW_REGISTRY_PULL_TOKEN_FILE="${MKW_REGISTRY_PULL_TOKEN_FILE:-$MKW_DEPLOY_PATH/shared/secrets/ghcr-pull-token}"
          install -m 700 -d "$HOME/.ssh"
          : "${MKW_SSH_HOST_FINGERPRINT:?Trusted SSH fingerprint is required}"
          ssh-keyscan -T 10 -p "$MKW_SSH_PORT" "$MKW_SSH_HOST" > "$RUNNER_TEMP/mkw_known_hosts"
          : > "$RUNNER_TEMP/mkw_pinned_hosts"
          while IFS= read -r line; do
            printf '%s\n' "$line" > "$RUNNER_TEMP/mkw_candidate"
            if [[ "$(ssh-keygen -lf "$RUNNER_TEMP/mkw_candidate" -E sha256 | awk '{print $2}')" == "$MKW_SSH_HOST_FINGERPRINT" ]]; then
              printf '%s\n' "$line" >> "$RUNNER_TEMP/mkw_pinned_hosts"
            fi
          done < "$RUNNER_TEMP/mkw_known_hosts"
          test -s "$RUNNER_TEMP/mkw_pinned_hosts"
          install -m 600 "$RUNNER_TEMP/mkw_pinned_hosts" "$HOME/.ssh/known_hosts"
          test -n "$MKW_SSH_PRIVATE_KEY"
          printf '%s\n' "$MKW_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/mkw_key"
          chmod 600 "$RUNNER_TEMP/mkw_key"
          printf -v remote_env 'MKW_DEPLOY_PATH=%q MKW_PROJECT_NAME=%q MKW_GATEWAY_PORT=%q MKW_RELEASE_SHA=%q MKW_API_IMAGE=%q MKW_POSTGRES_IMAGE=%q MKW_REGISTRY_HOST=%q MKW_REGISTRY_VISIBILITY=%q MKW_REGISTRY_PULL_USERNAME=%q MKW_REGISTRY_PULL_TOKEN_FILE=%q MKW_ATTESTATION_MODE=%q MKW_ATTESTATION_STATUS=%q MKW_OPERATION_KIND=application-rollback MKW_BACKUP_MAX_AGE_SECONDS=%q MKW_BACKUP_EXPECTED_KIND=%q MKW_BACKUP_EXPECTED_HOST=%q MKW_BACKUP_EXPECTED_DATABASE=%q MKW_BACKUP_EXPECTED_TARGET_IDENTITY=%q' \
            "$MKW_DEPLOY_PATH" "$MKW_PROJECT_NAME" "$MKW_GATEWAY_PORT" "$OLD_RELEASE_SHA" "$api_image" "$postgres_image" "${MKW_REGISTRY_HOST:-ghcr.io}" "${MKW_REGISTRY_VISIBILITY:-}" "${MKW_REGISTRY_PULL_USERNAME:-}" "${MKW_REGISTRY_PULL_TOKEN_FILE:-}" "$MKW_ATTESTATION_MODE" "$MKW_ATTESTATION_STATUS" "$MKW_BACKUP_MAX_AGE_SECONDS" "$MKW_BACKUP_EXPECTED_KIND" "$MKW_BACKUP_EXPECTED_HOST" "$MKW_BACKUP_EXPECTED_DATABASE" "$MKW_BACKUP_EXPECTED_TARGET_IDENTITY"
          remote_dir="${MKW_DEPLOY_PATH}/staging/${MKW_OPERATION_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          upload_dir="$remote_dir-upload"
          # Directories must be canonical; mkdir without -p reserves this upload attempt.
          printf -v remote_command 'set -Eeuo pipefail; [[ "$(realpath -e -- %q)" == %q ]] || exit 78; if [[ -e %q || -L %q ]]; then [[ "$(realpath -e -- %q)" == %q ]] || exit 78; else mkdir -m 750 -- %q; fi; mkdir -m 700 -- %q; mkdir -m 700 -- %q' \
            "$MKW_DEPLOY_PATH" "$MKW_DEPLOY_PATH" "$MKW_DEPLOY_PATH/staging" "$MKW_DEPLOY_PATH/staging" "$MKW_DEPLOY_PATH/staging" "$MKW_DEPLOY_PATH/staging" "$MKW_DEPLOY_PATH/staging" "$upload_dir" "$remote_dir"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" "$remote_command"
          scp -q -i "$RUNNER_TEMP/mkw_key" -P "$MKW_SSH_PORT" -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "$bundle/deployment-bundle.tar" "deploy@$MKW_SSH_HOST:$upload_dir/deployment-bundle.tar"
          # Bootstrap comes directly from trusted current controls, never the unverified archive.
          scp -q -r -i "$RUNNER_TEMP/mkw_key" -P "$MKW_SSH_PORT" -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "$bundle/controls" "deploy@$MKW_SSH_HOST:$upload_dir/bootstrap"
          # Host Node is optional: use the same validated immutable API runtime
          # for the trusted extractor's inventory checks, with read-only inputs.
          extractor='set -Eeuo pipefail; bootstrap=$1; archive=$2; stage=$3; api=$4; export bootstrap stage api; if ! command -v node >/dev/null 2>&1; then bash "$bootstrap/scripts/product/release/pull-exact-images.sh" "$api" || exit 77; run_node(){ docker run --rm -i --pull=never --user "$(id -u):$(id -g)" -v "$bootstrap:$bootstrap:ro" -v "$stage:$stage:ro" --entrypoint node "$api" "$@"; }; export -f run_node; fi; bash "$bootstrap/scripts/product/release/extract-release-bundle.sh" "$archive" "$stage"'
          printf -v remote_command '%s bash -c %q -- %q %q %q %q' "$remote_env" "$extractor" "$upload_dir/bootstrap" "$upload_dir/deployment-bundle.tar" "$remote_dir" "$api_image"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" "$remote_command"
          printf -v identity_env 'MKW_OPERATION_ID=%q MKW_CONTROL_ROOT=%q MKW_CONTROL_SHA=%q MKW_RELEASE_RUN_ID=%q MKW_RELEASE_RUN_ATTEMPT=%q MKW_RELEASE_ARTIFACT_ID=%q MKW_RELEASE_ARTIFACT_DIGEST=%q' "$MKW_OPERATION_ID" "$upload_dir/bootstrap" "$MKW_CONTROL_SHA" "$MKW_RELEASE_RUN_ID" "$MKW_RELEASE_RUN_ATTEMPT" "$MKW_RELEASE_ARTIFACT_ID" "$MKW_RELEASE_ARTIFACT_DIGEST"
          printf -v remote_command '%s %s bash %q --release --staging %q --manifest %q --compose %q --backup-ready %q' "$remote_env" "$identity_env" "$upload_dir/bootstrap/scripts/product/deploy-entrypoint.sh" "$remote_dir" "$remote_dir/release/release-manifest.json" "$remote_dir/release/deploy/compose.production.yml" "$remote_dir/operation/backup-ready.json"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" "$remote_command"

      - name: Emit rollback receipt and signal
        if: always()
        shell: bash
        env:
          OLD_RELEASE_SHA: ${{ inputs.old_release_sha }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          ROLLBACK_RESULT: ${{ job.status }}
          ATTESTATION_STATUS: ${{ steps.attestations.outputs.status || 'not-configured' }}
          CONTROL_SHA: ${{ steps.controls.outputs.commit }}
        run: |
          set -Eeuo pipefail
          [[ -n "$ROLLBACK_REASON" && "${#ROLLBACK_REASON}" -le 512 ]] || { echo 'rollback reason must be 1-512 characters' >&2; exit 64; }
          [[ "$ROLLBACK_REASON" != *$'\n'* && "$ROLLBACK_REASON" != *$'\r'* ]] || { echo 'rollback reason contains a control character' >&2; exit 64; }
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const reason = process.env.ROLLBACK_REASON ?? '';
          if (!reason || reason.length > 512 || /[\u0000-\u001f\u007f]/u.test(reason)) {
            throw new Error('rollback reason contains an invalid control character');
          }
          const receipt = {
            rollback: true,
            scope: 'application-only',
            databaseRecovery: false,
            databaseCompatibility: 'operator-approved-current-schema',
            attestationVerification: process.env.ATTESTATION_STATUS || 'not-verified',
            oldReleaseSha: process.env.OLD_RELEASE_SHA,
            controlSha: process.env.CONTROL_SHA,
            reason,
            result: process.env.ROLLBACK_RESULT,
            signal: 'rollback-requested',
          };
          await writeFile('rollback-receipt.json', `${JSON.stringify(receipt)}\n`, { mode: 0o600 });
          NODE
          test -s rollback-receipt.json
          echo "rollback-signal=rollback-requested" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mkw-rollback-receipt-${{ inputs.old_release_sha }}
          path: rollback-receipt.json
          if-no-files-found: error
