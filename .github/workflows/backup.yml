name: MKW encrypted production backup

run-name: "mkw-backup-${{ inputs.coordinator_id || github.run_id }}"

on:
  workflow_call:
    inputs:
      control_sha:
        description: Immutable control SHA for an automatic release; manual recovery uses current main
        required: false
        type: string
      coordinator_id:
        description: Unique release correlation
        required: false
        type: string
      kind:
        description: Backup contract kind
        required: false
        type: string
        default: BACKUP
      release_sha:
        description: Release SHA recorded in backup metadata
        required: true
        type: string
    secrets:
      MKW_SSH_PRIVATE_KEY:
        required: true
      MKW_BACKUP_ENCRYPTION_KEY:
        required: true
    outputs:
      correlation_id:
        description: Release correlation carried by this backup stage
        value: ${{ jobs.backup.outputs.correlation_id }}
      backup_artifact_digest:
        description: Exact producer backup_artifact_digest
        value: ${{ jobs.backup.outputs.backup_artifact_digest }}
      release_sha:
        description: Release SHA bound to the backup
        value: ${{ jobs.backup.outputs.release_sha }}
      backup_run_id:
        description: Backup workflow run ID
        value: ${{ jobs.backup.outputs.backup_run_id }}
      backup_run_attempt:
        description: Backup workflow run attempt
        value: ${{ jobs.backup.outputs.backup_run_attempt }}
      backup_artifact_id:
        description: Exact backup artifact ID
        value: ${{ jobs.backup.outputs.backup_artifact_id }}
      backup_artifact_name:
        description: Exact backup artifact name
        value: ${{ jobs.backup.outputs.backup_artifact_name }}
  workflow_dispatch:
    inputs:
      coordinator_id:
        description: Unique coordinator dispatch correlation
        required: false
        type: string
      kind:
        description: Backup contract kind
        required: true
        type: choice
        options: [BACKUP, INITIAL_EMPTY_DEPLOYMENT]
        default: BACKUP
      release_sha:
        description: Release SHA recorded in backup metadata
        required: true
        type: string
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: mkw-backup
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  backup:
    outputs:
      correlation_id: ${{ inputs.coordinator_id || github.run_id }}
      backup_artifact_digest: ${{ steps.upload-backup.outputs.artifact-digest || steps.upload-backup-empty.outputs.artifact-digest }}
      release_sha: ${{ inputs.release_sha || github.sha }}
      backup_run_id: ${{ github.run_id }}
      backup_run_attempt: ${{ github.run_attempt }}
      backup_artifact_id: ${{ steps.upload-backup.outputs.artifact-id || steps.upload-backup-empty.outputs.artifact-id }}
      backup_artifact_name: mkw-backup-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      BACKUP_KIND: ${{ inputs.kind || 'BACKUP' }}
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.MKW_BACKUP_ENCRYPTION_KEY }}
      MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
      MKW_DEPLOY_PATH: ${{ vars.MKW_DEPLOY_PATH }}
      MKW_PROJECT_NAME: ${{ vars.MKW_PROJECT_NAME }}
      MKW_SSH_PORT: ${{ vars.MKW_SSH_PORT }}
      MKW_SSH_HOST_FINGERPRINT: ${{ vars.MKW_SSH_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.control_sha || github.sha }}
          persist-credentials: false

      - name: Validate backup inputs
        shell: bash
        env:
          MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$ ]]
          command -v node >/dev/null
          [[ "$MKW_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$MKW_SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$MKW_DEPLOY_PATH" == /home/deploy/mkw && "$MKW_PROJECT_NAME" == mkw ]]
          if [[ "$BACKUP_KIND" == BACKUP ]]; then
            : "${MKW_SSH_HOST:?MKW_SSH_HOST is required for BACKUP}"
            : "${MKW_SSH_PORT:?MKW_SSH_PORT is required for BACKUP}"
            : "${MKW_SSH_HOST_FINGERPRINT:?MKW_SSH_HOST_FINGERPRINT is required for BACKUP}"
            : "${MKW_SSH_PRIVATE_KEY:?MKW_SSH_PRIVATE_KEY is required for BACKUP}"
            : "${BACKUP_ENCRYPTION_KEY:?MKW_BACKUP_ENCRYPTION_KEY is required}"
            command -v ssh >/dev/null
            command -v ssh-keyscan >/dev/null
            command -v docker >/dev/null
            command -v openssl >/dev/null
            command -v sha256sum >/dev/null
          elif [[ "$BACKUP_KIND" != INITIAL_EMPTY_DEPLOYMENT ]]; then
            echo "Unsupported backup kind: $BACKUP_KIND" >&2
            exit 1
          fi

      - name: Validate active coordinator parent
        if: startsWith(inputs.coordinator_id, 'parent-')
        env:
          COORDINATOR_ID: ${{ inputs.coordinator_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/product/release/check-coordinator-parent.mjs

      - name: Dump, encrypt, hash, and verify PostgreSQL backup
        if: env.BACKUP_KIND == 'BACKUP'
        shell: bash
        env:
          MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -m 700 -d "$HOME/.ssh"
          trap 'rm -f "$RUNNER_TEMP/mkw_key" "$RUNNER_TEMP/mkw_candidate"' EXIT
          ssh-keyscan -T 10 -p "$MKW_SSH_PORT" "$MKW_SSH_HOST" > "$RUNNER_TEMP/mkw_known_hosts"
          : > "$RUNNER_TEMP/mkw_pinned_hosts"
          while IFS= read -r line; do
            printf '%s\n' "$line" > "$RUNNER_TEMP/mkw_candidate"
            if [[ "$(ssh-keygen -lf "$RUNNER_TEMP/mkw_candidate" -E sha256 | awk '{print $2}')" == "$MKW_SSH_HOST_FINGERPRINT" ]]; then
              printf '%s\n' "$line" >> "$RUNNER_TEMP/mkw_pinned_hosts"
            fi
          done < "$RUNNER_TEMP/mkw_known_hosts"
          test -s "$RUNNER_TEMP/mkw_pinned_hosts"
          printf '%s\n' "$MKW_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/mkw_key"
          chmod 600 "$RUNNER_TEMP/mkw_key"
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$RUNNER_TEMP/mkw_pinned_hosts" "deploy@$MKW_SSH_HOST" \
            'MKW_DEPLOY_PATH=/home/deploy/mkw MKW_PROJECT_NAME=mkw bash -s' \
            < scripts/product/backup-source.sh | \
            BACKUP_DIR="$RUNNER_TEMP/mkw-backup" \
            BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            bash scripts/product/backup-runner.sh

      - name: Verify initial target is empty
        if: env.BACKUP_KIND == 'INITIAL_EMPTY_DEPLOYMENT'
        shell: bash
        env:
          MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${MKW_SSH_HOST:?MKW_SSH_HOST is required}"
          : "${MKW_SSH_PORT:?MKW_SSH_PORT is required}"
          : "${MKW_SSH_HOST_FINGERPRINT:?MKW_SSH_HOST_FINGERPRINT is required}"
          : "${MKW_DEPLOY_PATH:?MKW_DEPLOY_PATH is required}"
          : "${MKW_PROJECT_NAME:?MKW_PROJECT_NAME is required}"
          : "${MKW_SSH_PRIVATE_KEY:?MKW_SSH_PRIVATE_KEY is required}"
          install -m 700 -d "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$MKW_SSH_PORT" "$MKW_SSH_HOST" > "$RUNNER_TEMP/mkw_known_hosts"
          : > "$RUNNER_TEMP/mkw_pinned_hosts"
          while IFS= read -r line; do
            printf '%s\n' "$line" > "$RUNNER_TEMP/mkw_candidate"
            if [[ "$(ssh-keygen -lf "$RUNNER_TEMP/mkw_candidate" -E sha256 | awk '{print $2}')" == "$MKW_SSH_HOST_FINGERPRINT" ]]; then
              printf '%s\n' "$line" >> "$RUNNER_TEMP/mkw_pinned_hosts"
            fi
          done < "$RUNNER_TEMP/mkw_known_hosts"
          test -s "$RUNNER_TEMP/mkw_pinned_hosts"
          install -m 600 "$RUNNER_TEMP/mkw_pinned_hosts" "$HOME/.ssh/known_hosts"
          printf '%s\n' "$MKW_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/mkw_key"
          chmod 600 "$RUNNER_TEMP/mkw_key"
          [[ "$MKW_DEPLOY_PATH" == /home/deploy/mkw && "$MKW_PROJECT_NAME" == mkw ]]
          ssh -i "$RUNNER_TEMP/mkw_key" -p "$MKW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "deploy@$MKW_SSH_HOST" \
            "test ! -e '$MKW_DEPLOY_PATH/shared/backup-ready.json' && test ! -f '$MKW_DEPLOY_PATH/current/compose.rendered.yml' && ! docker ps -a --format '{{.Label \"com.docker.compose.project\"}}' | grep -Fxq '$MKW_PROJECT_NAME' && ! docker volume inspect 'mkw_pgdata' >/dev/null 2>&1"

      - name: Emit and validate backup-ready metadata
        shell: bash
        env:
          BACKUP_DIR: ${{ runner.temp }}/mkw-backup
        run: |
          set -Eeuo pipefail
          mkdir -p "$BACKUP_DIR"
          backup_id="mkw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          retention="$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$BACKUP_KIND" == BACKUP ]]; then
            digest="$(cut -d' ' -f1 "$BACKUP_DIR/database.dump.enc.sha256")"
            size="$(stat -c '%s' "$BACKUP_DIR/database.dump.enc")"
            database_host="$MKW_SSH_HOST"
            database_name="mkw"
          BACKUP_OUTPUT="$BACKUP_DIR/backup-ready.json" BACKUP_ID="$backup_id" CREATED_AT="$now" RETENTION_UNTIL="$retention" DUMP_SHA256="$digest" DUMP_SIZE="$size" DATABASE_HOST="$database_host" DATABASE_NAME="$database_name" RELEASE_SHA="$RELEASE_SHA" node --input-type=module - <<'NODE'
          const { writeFile } = await import('node:fs/promises');
          await writeFile(process.env.BACKUP_OUTPUT, JSON.stringify({ schemaVersion:'1', kind:'BACKUP', backupId:process.env.BACKUP_ID, releaseSha:process.env.RELEASE_SHA, createdAt:process.env.CREATED_AT, dumpSha256:process.env.DUMP_SHA256, size:Number(process.env.DUMP_SIZE), restoreVerified:true, retentionUntil:process.env.RETENTION_UNTIL, storageLocation:'github-actions-artifact:mkw-backup', databaseIdentity:{ host:process.env.DATABASE_HOST, name:process.env.DATABASE_NAME, engine:'postgresql' } }, null, 2)+'\n');
          NODE
          else
            : "${MKW_SSH_HOST:?MKW_SSH_HOST is required for INITIAL_EMPTY_DEPLOYMENT}"
            : "${MKW_DEPLOY_PATH:?MKW_DEPLOY_PATH is required for INITIAL_EMPTY_DEPLOYMENT}"
            : "${MKW_PROJECT_NAME:?MKW_PROJECT_NAME is required for INITIAL_EMPTY_DEPLOYMENT}"
            export TARGET_DATABASE='mkw' TARGET_HOST="$MKW_SSH_HOST" TARGET_PATH="$MKW_DEPLOY_PATH" TARGET_PROJECT="$MKW_PROJECT_NAME"
            BACKUP_OUTPUT="$BACKUP_DIR/backup-ready.json" BACKUP_ID="$backup_id" CREATED_AT="$now" RETENTION_UNTIL="$retention" RELEASE_SHA="$RELEASE_SHA" node --input-type=module - <<'NODE'
          const { writeFile } = await import('node:fs/promises');
          await writeFile(process.env.BACKUP_OUTPUT, JSON.stringify({ schemaVersion:'1', kind:'INITIAL_EMPTY_DEPLOYMENT', backupId:process.env.BACKUP_ID, releaseSha:process.env.RELEASE_SHA, createdAt:process.env.CREATED_AT, restoreVerified:false, retentionUntil:process.env.RETENTION_UNTIL, storageLocation:'github-actions-artifact:mkw-backup', databaseVerifiedEmpty:true, emptyEvidence:{ targetIdentity:`${process.env.TARGET_HOST}/${process.env.TARGET_PATH}/${process.env.TARGET_PROJECT}`, databaseIdentity:process.env.TARGET_DATABASE, checkedAt:process.env.CREATED_AT } }, null, 2)+'\n');
          NODE
          fi
          node scripts/product/release/validate-backup-ready.mjs "$BACKUP_DIR/backup-ready.json"
          cp "$BACKUP_DIR/backup-ready.json" .

      - name: Upload encrypted backup and readiness gate
        id: upload-backup
        if: env.BACKUP_KIND == 'BACKUP'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mkw-backup-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/mkw-backup/database.dump.enc
            ${{ runner.temp }}/mkw-backup/database.dump.enc.sha256
            ${{ runner.temp }}/mkw-backup/backup-ready.json

      - name: Upload initial-empty readiness gate
        id: upload-backup-empty
        if: env.BACKUP_KIND == 'INITIAL_EMPTY_DEPLOYMENT'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mkw-backup-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/mkw-backup/backup-ready.json
