name: MKW push-main release

run-name: "mkw-release-${{ github.sha }}-${{ github.run_attempt }}"

on:
  push:
    branches: [main]

concurrency:
  group: mkw-production-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_status: ${{ steps.state.outputs.release_status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read current transaction state
        env:
          MKW_SSH_HOST: ${{ vars.MKW_SSH_HOST }}
          MKW_SSH_PORT: ${{ vars.MKW_SSH_PORT }}
          MKW_SSH_HOST_FINGERPRINT: ${{ vars.MKW_SSH_HOST_FINGERPRINT }}
          MKW_DEPLOY_PATH: ${{ vars.MKW_DEPLOY_PATH }}
          MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
        run: bash scripts/product/release/probe-current-state.sh
      - name: Decide current source and rerun outcome
        id: state
        env:
          RELEASE_SHA: ${{ github.sha }}
          CURRENT_STATE_PATH: ${{ runner.temp }}/current-state.json
          GH_TOKEN: ${{ github.token }}
        run: node scripts/product/release/preflight.mjs

  quality:
    needs: preflight
    if: needs.preflight.outputs.release_status == 'ready'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: quality
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  backup:
    needs: quality
    uses: ./.github/workflows/backup.yml
    permissions:
      contents: read
      actions: read
    with:
      control_sha: ${{ github.sha }}
      coordinator_id: ${{ github.run_id }}-${{ github.run_attempt }}
      kind: BACKUP
      release_sha: ${{ github.sha }}
    secrets:
      MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
      MKW_BACKUP_ENCRYPTION_KEY: ${{ secrets.MKW_BACKUP_ENCRYPTION_KEY }}

  deploy:
    needs: [build, backup]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
      attestations: read
    with:
      control_sha: ${{ github.sha }}
      coordinator_id: ${{ github.run_id }}-${{ github.run_attempt }}
      operation_id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      release_run_attempt: ${{ needs.build.outputs.release_run_attempt }}
      release_artifact_digest: ${{ needs.build.outputs.release_artifact_digest }}
      backup_run_attempt: ${{ needs.backup.outputs.backup_run_attempt }}
      backup_artifact_digest: ${{ needs.backup.outputs.backup_artifact_digest }}
      mode: release
      release_sha: ${{ needs.build.outputs.release_sha }}
      release_run_id: ${{ needs.build.outputs.release_run_id }}
      release_artifact_id: ${{ needs.build.outputs.release_artifact_id }}
      release_artifact_name: ${{ needs.build.outputs.release_artifact_name }}
      api_digest: ${{ needs.build.outputs.api_digest }}
      web_digest: ${{ needs.build.outputs.web_digest }}
      postgres_image: ${{ needs.build.outputs.postgres_image }}
      backup_run_id: ${{ needs.backup.outputs.backup_run_id }}
      backup_artifact_id: ${{ needs.backup.outputs.backup_artifact_id }}
      backup_artifact_name: ${{ needs.backup.outputs.backup_artifact_name }}
      backup_kind: BACKUP
      backup_max_age_seconds: ${{ vars.MKW_BACKUP_MAX_AGE_SECONDS || '86400' }}
    secrets:
      MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}

  verify:
    needs: [build, deploy]
    if: needs.deploy.outputs.release_status == 'success'
    uses: ./.github/workflows/post-deploy-verify.yml
    permissions:
      contents: read
      actions: read
    with:
      control_sha: ${{ github.sha }}
      coordinator_id: ${{ github.run_id }}-${{ github.run_attempt }}
      mode: release
      release_sha: ${{ needs.build.outputs.release_sha }}
      release_run_id: ${{ needs.build.outputs.release_run_id }}
      release_artifact_id: ${{ needs.build.outputs.release_artifact_id }}
      api_digest: ${{ needs.build.outputs.api_digest }}
      web_digest: ${{ needs.build.outputs.web_digest }}
      postgres_image: ${{ needs.build.outputs.postgres_image }}
      rollback_on_failure: true
      operation_id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    secrets:
      MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}

  recovery:
    needs: [build, deploy, verify]
    if: ${{ always() && (needs.deploy.result == 'failure' || needs.verify.result == 'failure') }}
    uses: ./.github/workflows/automatic-rollback.yml
    permissions:
      contents: read
      actions: read
      attestations: read
    with:
      control_sha: ${{ github.sha }}
      release_sha: ${{ github.sha }}
      operation_id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      current_run_id: ${{ needs.build.outputs.release_run_id }}
      current_run_attempt: ${{ needs.build.outputs.release_run_attempt }}
      current_artifact_id: ${{ needs.build.outputs.release_artifact_id }}
      current_artifact_digest: ${{ needs.build.outputs.release_artifact_digest }}
    secrets:
      MKW_SSH_PRIVATE_KEY: ${{ secrets.MKW_SSH_PRIVATE_KEY }}
      MKW_BACKUP_ENCRYPTION_KEY: ${{ secrets.MKW_BACKUP_ENCRYPTION_KEY }}

  release-status:
    if: ${{ always() }}
    needs: [preflight, quality, build, backup, deploy, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_status: ${{ steps.status.outputs.release_status }}
      correlation_id: ${{ steps.status.outputs.correlation_id }}
      release_sha: ${{ steps.status.outputs.release_sha }}
    steps:
      - name: Record release correlation and status
        id: status
        env:
          RELEASE_STATUS: ${{ needs.deploy.outputs.release_status == 'superseded' && 'superseded' || needs.preflight.outputs.release_status == 'superseded' && 'superseded' || needs.deploy.outputs.release_status == 'already-deployed' && 'already-deployed' || needs.preflight.outputs.release_status == 'already-deployed' && 'already-deployed' || needs.verify.result == 'success' && 'success' || 'failed' }}
          RELEASE_SHA: ${{ github.sha }}
          CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STAGES_JSON: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          printf 'release_status=%s\n' "$RELEASE_STATUS" >> "$GITHUB_OUTPUT"
          printf 'correlation_id=%s\n' "$CORRELATION_ID" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "release_sha=$RELEASE_SHA"
            echo "correlation_id=$CORRELATION_ID"
            echo "quality=${{ needs.quality.result }} build=${{ needs.build.result }} backup=${{ needs.backup.result }} deploy=${{ needs.deploy.result }} verify=${{ needs.verify.result }}"
            printf '%s\n' "$STAGES_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
