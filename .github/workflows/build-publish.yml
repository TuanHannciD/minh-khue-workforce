name: MKW build and publish

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'contracts/**'
      - 'deploy/**'
      - 'scripts/product/**'
      - 'tests/product-tooling/**'
      - 'tests/product-e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-publish.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to build
        required: true
        type: string

concurrency:
  group: mkw-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select immutable source
        id: source
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          source_sha="${INPUT_SHA:-$EVENT_SHA}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source SHA must be a full 40-character lowercase commit SHA' >&2
            exit 64
          }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Validate deploy shell and product checks
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/product/deploy-entrypoint.sh
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm run product:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/mkw-api:${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/mkw-web:${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true

      - name: Resolve immutable PostgreSQL image digest
        id: postgres
        shell: bash
        run: |
          set -Eeuo pipefail
          postgres_digest="$(docker buildx imagetools inspect postgres:17-alpine |
            awk '/^Digest:/ {print $2; exit}')"
          [[ "$postgres_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Could not resolve an immutable postgres:17-alpine digest' >&2
            exit 78
          }
          echo "digest=$postgres_digest" >> "$GITHUB_OUTPUT"

      - name: Write immutable release manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$POSTGRES_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_owner="${OWNER,,}"
          {
            printf 'MKW_RELEASE_SHA=%s\n' "$SOURCE_SHA"
            printf 'MKW_API_IMAGE=ghcr.io/%s/mkw-api@%s\n' "$image_owner" "$API_DIGEST"
            printf 'MKW_WEB_IMAGE=ghcr.io/%s/mkw-web@%s\n' "$image_owner" "$WEB_DIGEST"
            printf 'MKW_POSTGRES_IMAGE=postgres@%s\n' "$POSTGRES_DIGEST"
          } > deploy/release.manifest
          chmod 0644 deploy/release.manifest
          cat deploy/release.manifest

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@v4
        with:
          name: mkw-release-${{ steps.source.outputs.sha }}
          if-no-files-found: error
          path: deploy/release.manifest
          retention-days: 30
