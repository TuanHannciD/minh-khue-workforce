packages:
  - apps/*

engineStrict: true
strictPeerDependencies: true
autoInstallPeers: false
saveExact: true
storeDir: .pnpm-store
strictDepBuilds: true
allowBuilds:
  "@nestjs/core": true
  esbuild: true
  # Telemetry-only postinstall; not a native/runtime build (reviewed report.js).
  "@scarf/scarf": false
  argon2: true
  "@prisma/engines": true
  prisma: true
minimumReleaseAgeExclude:
  - react-router-dom@7.18.5
  - react-router@7.18.5
  - "@hookform/resolvers@6.0.2"
  - lucide-react@1.63.0
